<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earnova Admin</title>
<style>
body{margin:0;background:#080b15;color:white;font-family:Arial;padding:15px}
.box{max-width:600px;margin:auto;background:#11172a;padding:20px;border-radius:20px}
h1{color:#ff4fa3}h2{margin-top:25px}
input{width:100%;padding:13px;margin:7px 0 15px;box-sizing:border-box;border:0;border-radius:10px;background:#202940;color:white}
button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c4dff,#ff3d9a);color:white;font-weight:bold}
.vip{background:#080d19;padding:12px;margin:10px 0;border-radius:15px}
</style>
</head>

<body>
<div class="box">

<h1>⚡ Earnova Admin</h1>

<h2>🎁 Welcome Bonus</h2>
<input id="bonus" type="number" value="20">

<h2>📢 Admin Channel</h2>
<input id="channel" placeholder="https://t.me/YourChannel">

<h2>💰 Minimum Withdraw</h2>
<input id="withdraw" type="number" value="100">

<h2>👑 VIP Levels</h2>

<div class="vip">
<b>VIP 1</b>
<input class="price" type="number" value="150">
<input class="rate" type="number" step="0.01" value="1.25">
</div>

<div class="vip">
<b>VIP 2</b>
<input class="price" type="number" value="290">
<input class="rate" type="number" step="0.01" value="1.35">
</div>

<div class="vip">
<b>VIP 3</b>
<input class="price" type="number" value="380">
<input class="rate" type="number" step="0.01" value="1.47">
</div>

<div class="vip">
<b>VIP 4</b>
<input class="price" type="number" value="470">
<input class="rate" type="number" step="0.01" value="2.09">
</div>

<div class="vip">
<b>VIP 5</b>
<input class="price" type="number" value="560">
<input class="rate" type="number" step="0.01" value="2.35">
</div>

<h2>📺 Ad Income</h2>
<input id="ad" type="number" value="1">

<h2>✅ Task Income</h2>
<input id="task" type="number" value="2">

<button onclick="save()">💾 SAVE SETTINGS</button>

<p id="msg"></p>

</div>

<script>
function save(){

let prices=document.querySelectorAll(".price");
let rates=document.querySelectorAll(".rate");

let vip=[];

for(let i=0;i<prices.length;i++){
vip.push({
level:i+1,
price:Number(prices[i].value),
rate:Number(rates[i].value)
});
}

let data={
welcomeBonus:Number(bonus.value),
adminChannel:channel.value,
minimumWithdraw:Number(withdraw.value),
adIncome:Number(ad.value),
taskIncome:Number(task.value),
vip:vip
};

localStorage.setItem(
"earnovaAdmin",
JSON.stringify(data)
);

document.getElementById("msg").innerHTML=
"✅ Settings Saved Successfully!";
}
</script>

</body>
  </html>
