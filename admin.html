<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnova Admin Control</title><style>*{box-sizing:border-box}body{margin:0;background:#070a14;color:#f5f7ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.hero,.card{background:#111728;border:1px solid #2b3653;border-radius:20px;box-shadow:0 15px 45px #0007}.hero{padding:22px;margin-bottom:14px;background:linear-gradient(135deg,#1b2340,#0d1120)}h1{margin:0 0 6px}.muted{color:#9ca7c1;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}button{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#ff602b,#ff9b52);color:#fff;font-weight:800;cursor:pointer}.card{padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#c4cce0;font-size:13px;margin:10px 0}input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #35415e;background:#090e1b;color:#fff}textarea{min-height:90px}.hidden{display:none}.item{padding:14px;border:1px solid #2a3550;background:#0b101e;border-radius:15px;margin:9px 0}.item img{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}.danger{background:#d63e57}.full{grid-column:1/-1}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>⚡ Earnova Admin Control</h1><div class="muted">Tasks, Payment, Users, VIP, Withdrawals এবং Settings</div></div><div class="tabs"><button onclick="show('tasks')">🎯 Tasks</button><button onclick="show('payments')">💳 Payments</button><button onclick="show('users')">👤 Users</button><button onclick="show('withdrawals')">💸 Withdrawals</button><button onclick="show('vip')">👑 VIP</button><button onclick="show('settings')">⚙️ Settings</button></div><section id="tasks" class="card"><h2>🎯 Task Manager</h2><div class="grid"><label>Task Title<input id="tt"></label><label>Reward ৳<input id="tr" type="number" step=".01"></label><label>Image URL<input id="ti" placeholder="https://..."></label><label>Task Link<input id="tl" placeholder="https://..."></label></div><label>Description<textarea id="td"></textarea></label><button onclick="addTask()">➕ Add Task</button><div id="taskList"></div></section><section id="payments" class="card hidden"><h2>💳 Payment Methods</h2><div class="grid"><label>Method Name<input id="pn" placeholder="bKash"></label><label>Number / Account<input id="pa"></label></div><label>Instruction<textarea id="pi"></textarea></label><button onclick="addPay()">➕ Add Payment Method</button><div id="payList"></div></section><section id="users" class="card hidden"><h2>👤 Users</h2><p class="muted">বাস্তব user list দেখাতে backend/database API যুক্ত করতে হবে।</p></section><section id="withdrawals" class="card hidden"><h2>💸 Withdrawals</h2><p class="muted">Approve/Reject-এর জন্য backend/database যুক্ত করতে হবে।</p></section><section id="vip" class="card hidden"><h2>👑 VIP Levels</h2><div id="vipList"></div><button onclick="saveVip()">💾 Save VIP</button></section><section id="settings" class="card hidden"><h2>⚙️ Settings</h2><div class="grid"><label>Welcome Bonus ৳<input id="wb" type="number" value="20"></label><label>Ad Reward ৳<input id="ar" type="number" step=".01" value="1"></label><label>Default Task Reward ৳<input id="dr" type="number" step=".01" value="2"></label><label>Minimum Withdraw ৳<input id="mw" type="number" value="100"></label><label>Admin Channel<input id="ac"></label><label>Site Name<input id="sn" value="Earnova"></label></div><button onclick="saveSettings()">💾 Save Settings</button><p id="msg" class="muted"></p></section></div><script>const K='earnova_admin';let d=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[],payments:[],vip:[[1,150,1.25],[2,290,1.35],[3,380,1.47],[4,470,2.09],[5,560,2.35]],settings:{welcome:20,ad:1,task:2,min:100,channel:'',name:'Earnova'}};const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(K,JSON.stringify(d))}function show(x){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(x).classList.remove('hidden')}function addTask(){d.tasks.push({id:Date.now(),title:$('tt').value,reward:+$('tr').value||0,image:$('ti').value,link:$('tl').value,desc:$('td').value});save();render()}function addPay(){d.payments.push({id:Date.now(),name:$('pn').value,account:$('pa').value,instruction:$('pi').value});save();render()}function delT(id){d.tasks=d.tasks.filter(x=>x.id!=id);save();render()}function delP(id){d.payments=d.payments.filter(x=>x.id!=id);save();render()}function saveVip(){d.vip=d.vip.map((v,i)=>[v[0],+$('vp'+i).value,+$('vr'+i).value]);save();msg('VIP saved ✅')}function saveSettings(){d.settings={welcome:+$('wb').value,ad:+$('ar').value,task:+$('dr').value,min:+$('mw').value,channel:$('ac').value,name:$('sn').value};save();msg('Settings saved ✅')}function msg(x){$('msg').textContent=x}function render(){$('taskList').innerHTML=d.tasks.map(x=>`<div class="item"><b>${esc(x.title)}</b><div>Reward ৳${x.reward}</div>${x.image?`<img src="${esc(x.image)}">`:''}<p class="muted">${esc(x.desc)}</p><button class="danger" onclick="delT(${x.id})">Delete</button></div>`).join('')||'<p class="muted">কোনো task নেই।</p>';$('payList').innerHTML=d.payments.map(x=>`<div class="item"><b>💳 ${esc(x.name)}</b><div>${esc(x.account)}</div><p class="muted">${esc(x.instruction)}</p><button class="danger" onclick="delP(${x.id})">Delete</button></div>`).join('')||'<p class="muted">কোনো payment নেই।</p>';$('vipList').innerHTML=d.vip.map((v,i)=>`<div class="item"><b>VIP ${v[0]}</b><div class="grid"><label>Price ৳<input id="vp${i}" type="number" value="${v[1]}"></label><label>Income %<input id="vr${i}" type="number" step=".01" value="${v[2]}"></label></div></div>`).join('');$('wb').value=d.settings.welcome;$('ar').value=d.settings.ad;$('dr').value=d.settings.task;$('mw').value=d.settings.min;$('ac').value=d.settings.channel;$('sn').value=d.settings.name}render();</script></body></html>
